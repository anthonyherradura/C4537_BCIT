<!DOCTYPE html> 
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anthony's Memory Game Lab</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header class="app-header">
        <section id="header-text">
            <!-- Header text goes here -->
        </section>
    </header>

    <main>
        <main class="app-main">
            <section id="setup-panel" class="setup-panel" aria-label="Game setup controls">
                <!-- UIManager injects the label, input, and Go button here -->
            </section>
        
            <section id="game-board" class="game-board" aria-label="Game board" role="region">
                <!-- GameBoard injects MemoryButton elements here -->
            </section>
        
            <section id="status-panel" class="status-panel" role="status" aria-live="polite">
                <!-- UIManager injects win/lose/error messages here -->
            </section>
        </main>
    </main>
    
    <footer>
        <section id="footer-text">
            <!-- Footer text goes here -->
        </section>
    </footer>
</body>
</html>
